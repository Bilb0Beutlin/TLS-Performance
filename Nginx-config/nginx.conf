worker_processes 1;
error_log /srv/nginx/error.log;

events {

}

http {

	server {

		listen 443 ssl;

		http2 on;

		ssl_prefer_server_ciphers on;


#		ssl_protocols TLSv1.2;
#		ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256;
#		ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384;
#		ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305;

		ssl_protocols TLSv1.3;
#		ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256;
		ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384;
#		ssl_conf_command Ciphersuites TLS_CHACHA20_POLY1305_SHA256;


#		ssl_certificate /srv/nginx/rsa.crt;
#		ssl_certificate_key /srv/nginx/rsa.key;
		ssl_certificate /srv/nginx/ecdsa.crt;
		ssl_certificate_key /srv/nginx/ecdsa.key;


		ssl_session_cache off;
#		ssl_session_cache shared:SSL:10m;


		location / {
			root /srv/nginx;
		}

	}

}